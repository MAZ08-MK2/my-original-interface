<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Security Access</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; overflow:hidden; height:100vh; width:100vw; display:flex; justify-content:center; align-items:center; }
        canvas { width:100vw; height:100vh; display:block; background:#000; }
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #0ff; font-family: sans-serif;
        }
        #pass-input {
            background: #111; border: 2px solid #0ff; color: #0ff;
            padding: 15px; font-size: 24px; text-align: center; border-radius: 10px;
            width: 200px; outline: none; margin-bottom: 20px;
        }
        #auth-btn { padding: 10px 30px; border: 1px solid #0ff; background: transparent; color: #0ff; cursor: pointer; border-radius: 5px; }
        #overlay {
            position:absolute; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.95); z-index:100;
            display:none; justify-content:center; align-items:center; cursor:pointer;
        }
        .btn-ui { padding:30px 60px; border:3px solid #0ff; border-radius:60px; font-size:28px; font-weight:bold; background:#001a1a; color:#0ff; }
    </style>
</head>
<body>
    <div id="auth-overlay">
        <h2>SECURITY ACCESS</h2>
        <input type="password" id="pass-input" placeholder="PASSCODE" inputmode="numeric">
        <button id="auth-btn" onclick="checkPass()">ENTER</button>
    </div>
    <div id="overlay" onclick="startAudio()"><div class="btn-ui">SYSTEM RECOVERY START</div></div>
    <canvas id="c"></canvas>

    <script>
        const PASS = "0310"; 
        function checkPass() {
            const input = document.getElementById('pass-input').value;
            if(input === PASS) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('overlay').style.display = 'flex'; 
            } else {
                alert("ACCESS DENIED"); document.getElementById('pass-input').value = "";
            }
        }

        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

                ctx.strokeRect(groupX, eqGroupY, groupW, partH);
