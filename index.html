<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MH DESIGN WORKS - MC2500</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; overflow:hidden; height:100vh; width:100vw; display:flex; justify-content:center; align-items:center; }
        canvas { width:100vw; height:100vh; display:block; background:#000; }
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #0ff; font-family: sans-serif;
        }
        #pass-input {
            background: #111; border: 2px solid #0ff; color: #0ff;
            padding: 15px; font-size: 24px; text-align: center; border-radius: 10px;
            width: 200px; outline: none; margin-bottom: 20px;
        }
        #auth-btn { padding: 10px 30px; border: 1px solid #0ff; background: transparent; color: #0ff; cursor: pointer; border-radius: 5px; }
        #overlay {
            position:absolute; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.95); z-index:100;
            display:none; justify-content:center; align-items:center; cursor:pointer;
        }
        .btn-ui { padding:20px 40px; border:2px solid #0ff; border-radius:40px; font-size:20px; font-weight:bold; background:#001a1a; color:#0ff; }
    </style>
</head>
<body>
    <div id="auth-overlay">
        <h2>SECURITY ACCESS</h2>
        <input type="password" id="pass-input" placeholder="PASSCODE" inputmode="numeric">
        <button id="auth-btn" onclick="checkPass()">ENTER</button>
    </div>
    <div id="overlay" onclick="startAudio()"><div class="btn-ui">SYSTEM RECOVERY START</div></div>
    <canvas id="c"></canvas>

    <script>
        const PASS = "0310"; 
        function checkPass() {
            const input = document.getElementById('pass-input').value;
            if(input === PASS) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('overlay').style.display = 'flex'; 
            } else {
                alert("ACCESS DENIED"); document.getElementById('pass-input').value = "";
            }
        }

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        async function startAudio() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioCtx.createMediaStreamSource(stream);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.4; 
            source.connect(analyser);
            const data = new Uint8Array(analyser.frequencyBinCount);
            document.getElementById('overlay').style.display = 'none';

            const barCount = 16;
            let peaks = [new Float32Array(barCount), new Float32Array(barCount)];

            let angleSmooth = [0, 0];
            let mtSmooth = [0, 0];

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(data);
                const w = canvas.width, h = canvas.height;
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);

                const isLandscape = w > h;
                const groupW = w * 0.96;
                const groupX = (w - groupW) / 2;
                const partH = h * 0.32; 
                const eqGroupY = h * 0.05; 
                const mtGroupY = eqGroupY + partH + (h * 0.03); 

                const deckColor = "rgba(0, 255, 255, 0.7)";
                ctx.strokeStyle = deckColor; ctx.lineWidth = isLandscape ? 2 : 3;
                ctx.strokeRect(groupX, eqGroupY, groupW, partH);
                ctx.strokeRect(groupX, mtGroupY, groupW, partH);

                const unitW = (groupW * 0.47);
                const centers = [w * 0.265, w * 0.735];

                centers.forEach((cx, idx) => {
                    const startX = cx - unitW / 2;
                    ctx.strokeStyle = deckColor; ctx.lineWidth = 1;
                    ctx.strokeRect(startX, eqGroupY, unitW, partH);
                    ctx.strokeRect(startX, mtGroupY, unitW, partH);

                    const labelW = isLandscape ? 25 : 30;
                    const graphX = startX + labelW;
                    const graphW = unitW - labelW - 5;
                    
                    ctx.font = isLandscape ? "9px Arial" : "11px Arial";
                    ctx.textAlign = "right";
                    ctx.fillStyle = "rgba(0, 255, 255, 0.9)";
                    const levels = ["+10", "+5", "0", "-10", "-20", "-40"];
                    levels.forEach((lv, i) => {
                        let ly = eqGroupY + (partH * (i / 5));
                        ctx.fillText(lv, graphX - 5, ly + 4);
                        ctx.strokeStyle = "rgba(0, 255, 255, 0.15)";
                        ctx.beginPath(); ctx.moveTo(graphX, ly); ctx.lineTo(graphX + graphW, ly); ctx.stroke();
                    });

                    const numCells = 30;
                    const cellH = (partH - 4) / numCells;
                    const bw = (graphW / barCount) - 2;

                    for (let i = 0; i < barCount; i++) {
                        let rawVal = data[i + (idx === 0 ? 2 : 6)] || 0;
                        let targetVal = (rawVal / 255) * numCells;
                        
                        // --- 常にカラーバーの先端に引っ付いて同時に落ちるロジック ---
                        // 1. 上昇時：もちろん引っ付く
                        // 2. 落下時：物理演算を使わず、現在のtargetValに直接追従させる
                        peaks[idx][i] = targetVal; 

                        let bx = graphX + i * (graphW / barCount) + 1;
                        
                        // EQバーの描画
                        let activeInt = Math.floor(targetVal);
                        for (let j = 0; j < activeInt; j++) {
                            if (j < 4) ctx.fillStyle = "#00ff00";
                            else if (j < 8) ctx.fillStyle = "#ffff00";
                            else if (j < 12) ctx.fillStyle = "#ff8800";
                            else ctx.fillStyle = "#ff0000";
                            let by = eqGroupY + partH - (j + 1) * cellH - 0.5;
                            ctx.fillRect(bx, by, bw, cellH - 1.0);
                        }

                        // ピークライン描画（常にカラーバーの最上部に描画）
                        if (peaks[idx][i] > 0.5) {
                            ctx.fillStyle = "#ffffff";
                            // Math.floorでバーの区切りに合わせることで、一体感を強調
                            let pby = eqGroupY + partH - (Math.floor(peaks[idx][i]) * cellH) - 1.0;
                            ctx.fillRect(bx, pby, bw, 2.0);
                        }
                    }

                    // --- メーター部 ---
                    const upY = mtGroupY + (partH * 0.3);
                    const loY = mtGroupY + (partH * 0.55);
                    ctx.strokeStyle = "rgba(0, 255, 255, 0.4)";
                    ctx.beginPath(); ctx.moveTo(startX + 10, upY); ctx.lineTo(startX + unitW - 10, upY); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(startX + 10, loY); ctx.lineTo(startX + unitW - 10, loY); ctx.stroke();

                    ctx.fillStyle = "rgba(0, 255, 255, 0.9)"; ctx.textAlign = "center";
                    ctx.font = isLandscape ? "9px Arial" : "11px Arial";
                    ["1.2", "12", "120", "1.2k"].forEach((t, k) => ctx.fillText(t, startX + 25 + k * (unitW-50)/3, upY - 6));
                    ["-40", "-30", "-20", "-10", "0", "+10"].forEach((tx, k) => ctx.fillText(tx, startX + 25 + k * (unitW-50)/5, loY + 13));

                    ctx.textAlign = "right"; 
                    ctx.font = "bold 10px Arial";
                    ctx.fillText("DECIBELS", startX + unitW - 10, mtGroupY + partH - 12);

                    ctx.textAlign = "center";
                    ctx.font = `bold ${isLandscape ? 14 : 18}px Arial`;
                    ctx.fillStyle = "#0ff";
                    ctx.fillText(idx===0?"LEFT":"RIGHT", cx, mtGroupY + partH * 0.85); 
                    ctx.font = `bold ${isLandscape ? 10 : 12}px Arial`;
                    ctx.fillText("POWER OUTPUT", cx, mtGroupY + partH * 0.95);

                    let vMt = (data[idx===0?4:10] || 0);
                    mtSmooth[idx] += ((vMt * 2.5) - mtSmooth[idx]) * 0.1;
                    let ang = -0.32 + (mtSmooth[idx]/255) * 0.64;
                    angleSmooth[idx] += (ang - angleSmooth[idx]) * 0.15;
                    ctx.save();
                    ctx.beginPath(); ctx.rect(startX, mtGroupY, unitW, partH); ctx.clip();
                    ctx.strokeStyle = "red"; ctx.lineWidth = 2.5;
                    const pivotY = mtGroupY + partH * 1.5;
                    ctx.beginPath(); ctx.moveTo(cx, pivotY);
                    ctx.lineTo(cx + Math.sin(angleSmooth[idx])*h, pivotY - Math.cos(angleSmooth[idx])*h);
                    ctx.stroke(); ctx.restore();
                });

                const logoY = mtGroupY + partH + (h * 0.08);
                ctx.fillStyle = "#00ff00"; ctx.font = `bold ${isLandscape ? 30 : 40}px 'Times New Roman'`; ctx.textAlign = "center";
                ctx.fillText("McIntosh", w/2, logoY);
                ctx.fillStyle = "#fff"; ctx.font = `${isLandscape ? 11 : 13}px Arial`; 
                ctx.fillText("MC2500 POWER AMPLIFIER", w/2, logoY + (isLandscape ? 16 : 20));
                ctx.fillStyle = "red"; ctx.font = `bold ${isLandscape ? 15 : 18}px Arial`; 
                ctx.fillText("MH DESIGN WORKS", w/2, logoY + (isLandscape ? 34 : 42));
            }
            draw();
        }
    </script>
</body>
</html>
